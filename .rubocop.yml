AllCops:
  Exclude:
    - vendor/**/*
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Layout/LineLength:
  Max: 512

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/GlobalVars:
  Exclude:
    - spec/**/*

Style/FrozenStringLiteralComment:
  Enabled: false
